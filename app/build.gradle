plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.baru.player'
    compileSdk 35

    defaultConfig {
        applicationId "com.baru.player"
        minSdk 24            // minimum untuk Chaquopy 17
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Hanya perlu kalau kamu menaruh binary QuickJS (libqjs.so) di jniLibs,
        // supaya file-nya diekstrak ke disk dan bisa dieksekusi.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install "yt-dlp"
            install "yt-dlp-ejs"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    def media3 = "1.8.0"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
