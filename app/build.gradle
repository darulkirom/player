plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.baru.player'
    compileSdk 35

    defaultConfig {
        applicationId "com.baru.player"
        minSdk 24            // minimum untuk Chaquopy 17
        targetSdk 35
        // naik otomatis di GitHub Actions supaya APK baru bisa menimpa yang lama
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Kunci debug tetap (ikut di repo) supaya tanda tangan APK selalu sama
    // dan update tidak perlu uninstall. Kredensial = default Android.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Hanya perlu kalau kamu menaruh binary QuickJS (libqjs.so) di jniLibs,
        // supaya file-nya diekstrak ke disk dan bisa dieksekusi.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            // Dikunci ke versi yang sama dengan yt-dlp di Termux (cek: yt-dlp --version)
            // supaya perilaku ekstraksinya identik dan tidak kena bug versi yang beda.
            install "yt-dlp==2026.08.19"
            install "yt-dlp-ejs"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    def media3 = "1.8.0"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
