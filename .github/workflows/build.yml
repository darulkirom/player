name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write           # perlu untuk membuat Release saat push tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Dipakai Chaquopy saat build (pip install yt-dlp)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Repo tidak menyertakan gradlew, jadi pakai Gradle dari action ini
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BaruPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Buat Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
